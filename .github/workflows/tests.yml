# Runs the test suite on every pull request and on pushes to the main
# branches, so a regression shows on the PR before it is merged.
#
#   - "shipped deps": the versions the apps are built with
#     (packaging/constraints.txt), on Windows and Linux;
#   - "newest deps": whatever is newest on PyPI within requirements.txt, on
#     Linux, to see an upstream break (pandas 3...) before it reaches a build.
#
# The Qt tests run offscreen (tests/qt/conftest.py).
name: Tests

on:
  pull_request:
  push:
    branches: [main, master, sync-local-work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows · shipped deps
            constraints: true
          - os: ubuntu-latest
            label: Linux · shipped deps
            constraints: true
          - os: ubuntu-latest
            label: Linux · newest deps
            constraints: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/constraints.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.constraints }}" = "true" ]; then
            python -m pip install -r requirements.txt -c packaging/constraints.txt pytest pytest-qt
          else
            python -m pip install --upgrade -r requirements.txt pytest pytest-qt
          fi
          python -m pip list | grep -iE "^(pandas|numpy|matplotlib|scipy|neurokit2|pyside6-essentials|pyqtgraph) "

      # The Qt tests run offscreen (tests/qt/conftest.py), but Qt still needs
      # its EGL / xkb / xcb system libraries.
      - name: Libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1
          libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
          libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Run the tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q -p no:cacheprovider -rf

      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pytest -q -p no:cacheprovider -rf
